<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Captura de Datos</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="dive"> 
    <h1>Captura de Datos Personales</h1>
    <p>Mi primera encuesta</p>
    <hr>

    <form action="resultados.html" method="GET">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required />

      <label for="edad">Edad</label>
      <input type="number" id="edad" name="edad" placeholder="Ingresa tu edad" required />

      <label for="ciudad">Ciudad donde vives</label>
      <input type="text" id="ciudad" name="ciudad" placeholder="Ingresa la ciudad" required />

      <label for="fechanacimiento">Fecha de nacimiento</label>
      <input type="date" id="fechanacimiento" name="fechanacimiento" required />

      <label for="pasatiempo">Pasatiempo Favorito</label>
      <input type="text" id="pasatiempo" name="pasatiempo" placeholder="Pasatiempo favorito" required />

      <br>
      <button type="submit">¡Ingresamos Datos!</button>
    </form>
  </div>
</body>
<script src="https://kit.fontawesome.com/a71707a89a.js" crossorigin="anonymous"></script>
</html>
